name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish scanned images from a verified main merge
        required: true
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify secrets in pull request commits
        uses: trufflesecurity/trufflehog@c85580b712841eda4c53bc28fc6ace6100e8c16c # v3.99.4
        with:
          version: 3.99.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run validate

  publish-images:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.publish_images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read
      pull-requests: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Verify the main merge and required PR checks
        id: verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-release-main.mjs

      - name: Build all release images with the source commit label
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for image in web api migration postgres backup backup-metrics; do
            case "$image" in
              web) dockerfile=apps/web/Dockerfile.production ;;
              api) dockerfile=apps/api/Dockerfile.production ;;
              migration) dockerfile=apps/api/Dockerfile.migrate ;;
              postgres) dockerfile=apps/api/Dockerfile.postgres ;;
              backup) dockerfile=apps/api/Dockerfile.backup ;;
              backup-metrics) dockerfile=apps/backup-metrics/Dockerfile ;;
            esac
            repository="ghcr.io/$owner/monikey-v2-$image"
            docker build \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              -f "$dockerfile" \
              -t "$repository:$IMAGE_TAG" .
          done

      - name: Scan every local image before publication
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trivy"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for image in web api migration postgres backup backup-metrics; do
            repository="ghcr.io/$owner/monikey-v2-$image"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/trivy:/root/.cache/" \
              aquasec/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
              image --scanners vuln --severity HIGH,CRITICAL \
              --exit-code 1 --skip-version-check "$repository:$IMAGE_TAG"
          done

      - name: Publish and scan immutable registry digests
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: sha-${{ github.sha }}
          VALIDATED_PR: ${{ steps.verify.outputs.pull_request }}
          VALIDATED_PR_HEAD: ${{ steps.verify.outputs.pull_request_head }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          artifact_dir="$RUNNER_TEMP/monikey-v2-release"
          mkdir -p "$artifact_dir" "$RUNNER_TEMP/syft"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          migration_schema_version="$(node scripts/prisma-schema-version.mjs)"
          printf 'source_commit=%s\nmigration_schema_version=%s\nvalidated_pr=%s\nvalidated_pr_head=%s\n' \
            "$GITHUB_SHA" "$migration_schema_version" "$VALIDATED_PR" "$VALIDATED_PR_HEAD" \
            > "$artifact_dir/release-manifest.txt"
          for image in web api migration postgres backup backup-metrics; do
            repository="ghcr.io/$owner/monikey-v2-$image"
            tag="$repository:$IMAGE_TAG"
            push_log="$RUNNER_TEMP/push-$image.log"
            docker push "$tag" | tee "$push_log"
            digest="$(sed -nE 's/.*digest: (sha256:[a-f0-9]{64}).*/\1/p' "$push_log" | tail -n 1)"
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "Could not resolve the published digest for $repository" >&2
              exit 1
            fi
            printf '%s=%s@%s\n' "$image" "$repository" "$digest" \
              >> "$artifact_dir/release-manifest.txt"
            docker pull "$repository@$digest"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/trivy:/root/.cache/" \
              -v "$artifact_dir:/release" \
              aquasec/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
              image --scanners vuln --severity HIGH,CRITICAL \
              --exit-code 1 --skip-version-check --format json \
              --output "/release/trivy-$image.json" "$repository@$digest"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/syft:/sbom" \
              anchore/syft@sha256:f94e5d9fce1f2278491a8e3a63bd5f6ddb81fdfdbb8bf7a1637565c1d5344357 \
              "$repository@$digest" \
              -o "spdx-json=/sbom/monikey-v2-$image.spdx.json"
            mv "$RUNNER_TEMP/syft/monikey-v2-$image.spdx.json" "$artifact_dir/"
          done
          cat "$artifact_dir/release-manifest.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify complete immutable digest manifest
        if: success()
        env:
          RELEASE_MANIFEST: ${{ runner.temp }}/monikey-v2-release/release-manifest.txt
          VALIDATED_PR: ${{ steps.verify.outputs.pull_request }}
          VALIDATED_PR_HEAD: ${{ steps.verify.outputs.pull_request_head }}
        run: node scripts/verify-release-manifest.mjs

      - name: Retain digest map, scans, and SPDX SBOMs
        if: always() && steps.release.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monikey-v2-release-${{ github.sha }}
          path: ${{ runner.temp }}/monikey-v2-release/
          if-no-files-found: error
          retention-days: 90
