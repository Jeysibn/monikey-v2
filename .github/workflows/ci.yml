name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:invariants
      - run: npm run format:check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose up --build -d --wait --wait-timeout 180 api web
      - name: Create isolated E2E owner account
        run: >-
          docker compose exec -T -e MONIKEY_BOOTSTRAP_EMAIL=owner@example.test
          -e MONIKEY_BOOTSTRAP_PASSWORD=CI-only-password-never-used-outside-tests
          api npm run bootstrap-owner --workspace @monikey/api
      - name: Create isolated E2E second user
        run: >-
          docker compose exec -T -e NODE_ENV=test -e ALLOW_E2E_USER_SEED=true
          -e MONIKEY_E2E_EMAIL=second@example.test
          -e MONIKEY_E2E_PASSWORD=CI-only-second-user-password-never-used
          api npm run seed-e2e-user --workspace @monikey/api
      - name: Verify financial schema constraints
        run: docker compose exec -T db psql -U monikey -d monikey -f - < prisma/tests/financial_schema.sql
      - name: Verify ledger service against PostgreSQL
        run: docker compose exec -T api npm run test:ledger --workspace @monikey/api
      - name: Verify account lifecycle against PostgreSQL
        run: docker compose exec -T api npm run test:accounts --workspace @monikey/api
      - name: Verify category lifecycle against PostgreSQL
        run: docker compose exec -T api npm run test:categories --workspace @monikey/api
      - name: Verify transaction commands against PostgreSQL
        run: docker compose exec -T api npm run test:transactions --workspace @monikey/api
      - run: npm run test:e2e
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes --remove-orphans

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
